name: Platform tests

on:
  push:
    branches: [main, windows-port, feature/macos]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore project-local dependencies
        shell: powershell
        run: .\scripts\windows\bootstrap.ps1
      - name: Run Windows tests
        shell: powershell
        run: .\scripts\windows\test.ps1

  macos:
    name: macOS tests and app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap whisper.cpp with Metal
        run: ./scripts/bootstrap.sh
      - name: Run macOS tests
        shell: bash
        run: |
          set +e
          ./scripts/test.sh 2>&1 | tee macos-test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -E '(^|: )(error:|fatal error:|failed:|XCTAssert)' macos-test.log | tail -40 | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done
          fi
          exit "$status"
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict dist/VoxLocal.app
      - name: Upload unsigned-development app
        uses: actions/upload-artifact@v4
        with:
          name: VoxLocal-macOS-development
          path: dist/VoxLocal.app
          if-no-files-found: error
